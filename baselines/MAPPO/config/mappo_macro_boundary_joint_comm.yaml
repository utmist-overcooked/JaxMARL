LR: 0.0003
NUM_ENVS: 16
NUM_STEPS: 400        # must be a multiple of ENV_KWARGS.max_steps (boundary requirement)
TOTAL_TIMESTEPS: 20000000
REW_SHAPING_HORIZON: 10000000
HIDDEN_SIZE: 128      # must match the frozen boundary run's HIDDEN_SIZE
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 4
GAMMA: 0.99
GAE_LAMBDA: 0.95
CLIP_EPS: 0.2
ENT_COEF: 0.05
VF_COEF: 0.5
MAX_GRAD_NORM: 0.5
ANNEAL_LR: true

USE_RNN: true

ENV_NAME: overcooked_v3_macro
# Nothing is loaded from disk here, so ENV_KWARGS is free to differ from any
# other run -- but to compare against a no-comm baseline or across COMM_MODEs,
# every obs-affecting entry (layout, agent_view_size, and anything changing the
# macro action count) must be identical across the runs being compared.
ENV_KWARGS:
  layout: follow_the_leader_nerfed
  max_steps: 400
  max_macro_steps: 150  # must exceed pot_cook_time + pot_burn_time (90+60=150 by default) or
                         # wait_for_nearest_pot always times out before the pot is ever ready
  agent_view_size: 2  # 3x3 window -- matches mappo_macro_boundary.yaml, which
                       # produced the frozen actor this builds on
  dense_task_shaping: true  # TASK_PROGRESS/TASK_FACING/INVALID_MOVE -- dense guidance
                             # toward whatever the current useful target is, on top of
                             # the discrete event rewards in SHAPED_REWARDS
  resample_recipe_on_delivery: true  # after a delivery, pick a new recipe at random (default: false)

SEED: 0
NUM_SEEDS: 1
SAVE_PATH: models/mappo_macro
WANDB_MODE: online
ENTITY: "zacharytang24-"
PROJECT: "veer-macro-actions-comm"
LOG_INTERVAL_UPDATES: 10
CHECKPOINT_INTERVAL_UPDATES: 100
EVAL_INTERVAL_UPDATES: 100
NUM_EVAL_ENVS: 8
EVAL_SEED: 42
RESUME_FROM: null

VOCAB_SIZE: 2              # 2 discrete message symbols per macro boundary
MESSAGE_EMBED_DIM: 2       # tiny vocab -> tiny embedding table
COMM_HIDDEN_SIZE: 64       # comm module is a thin side-network

# Give the comm module its own GRU over the observation stream, so an agent can
# keep transmitting something it saw earlier (a recipe indicator it has since
# walked away from) instead of only describing its current view. Deliberately
# separate from the frozen actor's memory, which encodes what was useful for
# ACTING without communication -- not necessarily what is worth saying.
# Requires USE_RNN: true.
COMM_USE_MEMORY: true

MESSAGE_ENT_COEF: 0.05     # extra entropy pressure so a small vocab doesn't
                            # collapse onto a single symbol early
MESSAGE_LOSS_COEF: 1.0     # equal weight to the action loss to start


# Nothing is frozen in this trainer, so there is no FROZEN_ACTOR_PATH /
# FROZEN_CRITIC_PATH -- the macro policy, critic and comm module are all
# trained together from scratch.

# How a sent message reaches its recipient. Architecture, parameter count and
# training budget are identical across all four; only the information carried
# differs, which is what makes these clean controls:
#   normal   - partner's message (real communication)
#   self     - own message back (same capacity, zero information transfer)
#   shuffled - partner's message from a random env (breaks the link to THIS
#              env's recipe while preserving message statistics)
#   constant - fixed symbol (channel fully severed)
COMM_MODE: normal

# How a received message reaches the policy.
#   concat - embed the symbol and concatenate it onto the actor's observation,
#            so the trunk conditions on it from its first layer and the action
#            loss trains the embedding (and, through it, the speaker)
#   bias   - the two-stage trainer's additive correction on the actor's output
#            logits; kept only as an ablation, since it makes the channel fight
#            the trunk's own confident output rather than inform it
# These produce different actor input widths, so their checkpoints are NOT
# interchangeable.
COMM_INJECTION: concat

# Init scale of the speaker's message-logit head. 0.0 gives uniform initial
# messages but blocks gradient to the speaker's encoder and GRU entirely (that
# kernel IS the Jacobian into them), so the informed agent cannot learn to
# encode what it sees. Small non-zero keeps messages near-uniform -- so no
# premature commitment to one symbol -- while letting the encoder train from
# step 0. Raise toward 1.0 only if the speaker stays uninformative.
MESSAGE_HEAD_INIT_SCALE: 0.01
