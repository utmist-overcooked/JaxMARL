LR: 0.0003
NUM_ENVS: 16
NUM_STEPS: 125
TOTAL_TIMESTEPS: 5000000
REW_SHAPING_HORIZON: 2500000
HIDDEN_SIZE: 128
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 4
GAMMA: 0.99
GAE_LAMBDA: 0.95
CLIP_EPS: 0.2
ENT_COEF: 0.01
VF_COEF: 0.5
MAX_GRAD_NORM: 0.5
ANNEAL_LR: true

ENV_NAME: overcooked_v3_macro_interruptible
ENV_KWARGS:
  layout: race_against_the_clock
  max_steps: 400
  max_macro_steps: 150  # must exceed pot_cook_time + pot_burn_time (90+60=150 by default) or
                         # wait_for_nearest_pot always times out before the pot is ever ready
  agent_view_size: 2  # 5x5 window (agent's cell + 2 rings); null/omit for full observability

SEED: 0
NUM_SEEDS: 1
SAVE_PATH: models/mappo_macro
WANDB_MODE: disabled
ENTITY: ""
PROJECT: ""
LOG_INTERVAL_UPDATES: 10
CHECKPOINT_INTERVAL_UPDATES: 100
EVAL_INTERVAL_UPDATES: 100
NUM_EVAL_ENVS: 8
EVAL_SEED: 42
RESUME_FROM: null

VOCAB_SIZE: 2              # 2 discrete message symbols per step, as you specified
MESSAGE_EMBED_DIM: 2       # small vocab, no need for a big embedding table
COMM_HIDDEN_SIZE: 64       # comm module is a thin side-network; leave unset to just reuse HIDDEN_SIZE

MESSAGE_ENT_COEF: 0.05     # higher than your usual ENT_COEF (often ~0.01) —
                            # a 2-symbol categorical collapses to one symbol
                            # fast without extra entropy pressure early on
MESSAGE_LOSS_COEF: 1.0     # equal weight to the action loss to start; watch
                            # the two loss curves and adjust if one dominates

FROZEN_ACTOR_PATH: models/mappo_macro/mappo_macro_every_step/seed_0/best_actor.safetensors
FROZEN_CRITIC_PATH: models/mappo_macro/mappo_macro_every_step/seed_0/best_critic.safetensors
