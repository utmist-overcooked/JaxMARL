hydra:
  run:
    dir: ${oc.env:SCRATCH,.}/jaxmarl/outputs/mappo_rnn_overcooked_v3_full_obs/${now:%Y-%m-%d}/${now:%H-%M-%S}

"ENV_KWARGS":
  "layout": "button_gated_zones"
  "agent_view_size": null
  "shaped_rewards": True
  "random_agent_positions": True
  "max_steps": 400

# Optimization & Learning Scaling
"LR": 0.0003                      # Scaled up to account for the larger global batch size
"ANNEAL_LR": True
"LR_WARMUP": 0.05

# --- THE EFFICIENCY ENGINE (4GB VRAM-SAFE) ---
"NUM_ENVS": 128                  # Halved from 256 to fit CNN gradients into 4GB
"NUM_STEPS": 128
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 4             # Halved from 8. Minibatch size remains (128 * 128) / 4 = 4,096

"TOTAL_TIMESTEPS": 2e7            # REDUCED from 6e7: observed ~7.16 updates/min means 6e7 steps would take ~8.5h; 2e7 is a realistic checkpoint (~2.8h) to validate CROSS_INTO_ZONE before committing to a longer run
"REW_SHAPING_HORIZON": 1.2e7      # REDUCED from 1.6e7 (80% of run): anneals shaping out at 60% of training, giving agents ~800K steps of sparse-only practice to consolidate CROSS_INTO_ZONE before the run ends
"SHAPED_REWARD_SCALE": 1.0

"FC_DIM_SIZE": 64
"GRU_HIDDEN_DIM": 128

"CLIP_EPS": 0.2
"ENT_COEF": 0.12      # RAISED from 0.08: entropy plot shows a hard collapse (~1.6 -> 0.6-1.4) right as reward first spikes around step 450, i.e. premature convergence onto local shaped-reward behavior before the agent discovers button-press-then-cross. More entropy bonus keeps exploration alive long enough for CROSS_INTO_ZONE to be discovered.
"GAMMA": 0.995        # UPDATED FOR GATED ZONES
"GAE_LAMBDA": 0.95
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"
"SEED": 0
"NUM_SEEDS": 1

"ENTITY": "zach-tang-university-of-toronto"
"PROJECT": "button-gated-zones-mappo-full-obs"
"WANDB_MODE": "online"
"WANDB_RUN_NAME": "button_gated_zones_mappo_full_obs"
"WANDB_DIR": "${oc.env:SCRATCH,.}/jaxmarl/mappo_overcooked_v3_full_obs"
"USE_RICH_MONITOR": False