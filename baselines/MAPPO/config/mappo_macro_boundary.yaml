LR: 0.0003
NUM_ENVS: 16
NUM_STEPS: 400
TOTAL_TIMESTEPS: 20000000
REW_SHAPING_HORIZON: 10000000
HIDDEN_SIZE: 128
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 4
GAMMA: 0.99
GAE_LAMBDA: 0.95
CLIP_EPS: 0.2
ENT_COEF: 0.05
VF_COEF: 0.5
MAX_GRAD_NORM: 0.5
ANNEAL_LR: true

USE_RNN: true

ENV_NAME: overcooked_v3_macro
ENV_KWARGS:
  layout: cramped_room
  max_steps: 400
  max_macro_steps: 150  # must exceed pot_cook_time + pot_burn_time (90+60=150 by default) or
                         # wait_for_nearest_pot always times out before the pot is ever ready
  pot_cook_time_range: [20, 90]  # randomize cook time per pot-start event instead of the
                                  # fixed 90-step default (sample_pot_cook_time)                         
  agent_view_size: 2  # 3x3 window (agent's cell + 1 ring); null/omit for full observability
  dense_task_shaping: true  # TASK_PROGRESS/TASK_FACING/INVALID_MOVE -- dense guidance
                             # toward whatever the current useful target is, on top of
                             # the discrete event rewards in SHAPED_REWARDS
  resample_recipe_on_delivery: false  # after a delivery, pick a new recipe at random (default: false)

SEED: 0
NUM_SEEDS: 1
SAVE_PATH: models/mappo_macro
WANDB_MODE: online
ENTITY: "zacharytang24-"
PROJECT: "veer-macro-actions-comm"
LOG_INTERVAL_UPDATES: 10
CHECKPOINT_INTERVAL_UPDATES: 100
EVAL_INTERVAL_UPDATES: 100
NUM_EVAL_ENVS: 8
EVAL_SEED: 42
RESUME_FROM: null

# Oracle control: append the true recipe to EVERY agent's observation, removing
# the information asymmetry the comm channel exists to bridge. This is the
# upper bound for any protocol -- if a policy handed the recipe outright still
# will not condition its ingredient choice on it, the blocker is the task/RL
# setup, not the channel. Widens the actor observation, so oracle and non-oracle
# checkpoints are not interchangeable.
ORACLE_RECIPE_OBS: false

# Same idea as ORACLE_RECIPE_OBS, for pot-readiness instead of recipe:
# appends a single scalar (1.0 if ANY active pot is cooked-and-ready, else
# 0.0) to every agent's observation, bypassing the need to be standing near
# a pot to know it just finished. Does not touch MacroActions or either
# environment file. Widens the actor observation like ORACLE_RECIPE_OBS, so
# it is not interchangeable with a checkpoint trained without it.
ORACLE_POT_READY_OBS: false
