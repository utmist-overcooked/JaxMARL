# CommNet-MAPPO RNN training configuration for Overcooked V3 (primitive actions).
# Mirrors mappo_rnn_overcooked_v3.yaml so the two can be compared directly; the
# only additions are the CommNet block settings below. NUM_ENVS must be
# divisible by NUM_MINIBATCHES: minibatches are split over environments so that
# agents which communicate stay together.
ENV_NAME: "overcooked_v3"
ENV_KWARGS:
  layout: "cramped_room"
  max_steps: 400
  pot_cook_time: 20
  pot_burn_time: 40
  enable_order_queue: false
  max_orders: 5
  order_generation_rate: 0.0
  order_expiration_time: 200
  order_queue_mode: "random"
  enable_item_conveyors: false
  enable_player_conveyors: false
  # Dish washing needs a layout with a sink (S) and a dirty plate pile (D),
  # e.g. prep_kitchen_wash. Off by default so existing layouts are unaffected.
  enable_dish_washing: false
  num_plates: 3
  # How many plates start dirty. The dirty pile otherwise only fills on a
  # delivery, so with 0 the wash sub-task (and its shaped rewards) is
  # unreachable until the agents can already complete a dish.
  initial_dirty_plates: 0
  # Set agent_view_size to give agents a limited egocentric view instead of the
  # whole grid - this is the partial-observability arm of the communication
  # comparison. null (the default) means full observability.
  agent_view_size: null

# Communication. Agents exchange GRU hidden states for COMM_PASSES rounds
# before the policy head; COMM_MODE is 'avg' or 'sum' aggregation of the other
# agents' messages. COMM_PASSES: 0 disables communication entirely, which makes
# this script an exact ablation control for the non-communicating MAPPO.
COMM_PASSES: 2
COMM_MODE: "avg"

# Network. Actor and critic each get their own CNN+GRU of this size.
GRU_HIDDEN_DIM: 128
FC_DIM_SIZE: 128
ACTIVATION: "relu"

# Training
TOTAL_TIMESTEPS: 80_000_000
NUM_ENVS: 128
NUM_STEPS: 200
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 8
ANNEAL_LR: true

# Reward shaping (linear anneal from 1.0 → 0.0 over this many timesteps)
REW_SHAPING_HORIZON: 60_000_000
REW_SHAPING_MIN_COEFF: 0.0
# v3 shaped rewards are 0.1–0.3; v1 uses 3.0–5.0.
# SHAPED_REWARD_COEFF=30 makes v3 values (30×0.1=3.0) match v1 magnitudes.
SHAPED_REWARD_COEFF: 30.0

# PPO hyperparameters
LR: 0.0005
GAMMA: 0.99
GAE_LAMBDA: 0.95
CLIP_EPS: 0.2
ENT_COEF: 0.01
ENT_COEF_MIN: 0.0
ENTROPY_FLOOR: 0.0
ENTROPY_FLOOR_COEF: 0.0
VF_COEF: 0.5
MAX_GRAD_NORM: 0.5

# Logging
WANDB_MODE: "disabled"
ENTITY: "dannyb3334-university-of-toronto"
WANDB_PROJECT: "jaxmarl-mappo"
WANDB_NAME: "mappo_commnet_overcooked_v3_cramped_room"
SAVE_PATH: "checkpoints/mappo_commnet_overcooked_v3_cramped_room"
SAVE_GIF_PATH: null
LOG_EVERY: 100
CHECKPOINT_EVERY: 5000

SEED: 42
