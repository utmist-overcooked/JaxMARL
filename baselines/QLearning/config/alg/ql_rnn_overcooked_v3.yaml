# valid for iql, vdn, qmix
"TOTAL_TIMESTEPS": 15e6
"NUM_ENVS": 128
"NUM_STEPS": 32
"BUFFER_SIZE": 131072
"BUFFER_BATCH_SIZE": 32
"HIDDEN_SIZE": 256
"MIXER_EMBEDDING_DIM": 64 # just for qmix
"MIXER_HYPERNET_HIDDEN_DIM": 256 # just for qmix
"MIXER_INIT_SCALE": 0.001 # just for qmix
"EPS_START": 1.0
"EPS_FINISH": 0.05
"EPS_DECAY": 0.2 # percentage of updates
"MAX_GRAD_NORM": 10
"TARGET_UPDATE_INTERVAL": 10
"TAU": 1.
"NUM_EPOCHS": 4
"LR": 0.00005
"LEARNING_STARTS": 10000 # timesteps
"LR_LINEAR_DECAY": False
"GAMMA": 0.99
"REW_SCALE": 1.
"SHAPED_REWARD_COEFF": 30.0
"REW_SHAPING_HORIZON": 15e6
"REW_SHAPING_MIN_COEFF": 0.10

# ENV
"ENV_NAME": "overcooked_v3"
"ENV_KWARGS":
  "layout": "around_the_island"
  "agent_view_size": 3
  "max_steps": 1000
  "pot_cook_time": 20
  "pot_burn_time": 40
  "enable_order_queue": true
  "max_orders": 5
  "order_generation_rate": 1.0
  "order_expiration_time": 0
  "order_queue_mode": "alternating"
  "enable_item_conveyors": false
  "enable_player_conveyors": false

# evaluate
"TEST_DURING_TRAINING": True
"TEST_INTERVAL": 0.05 # as a fraction of updates
"TEST_NUM_STEPS": 1000
"TEST_NUM_ENVS": 256 # number of episodes to average over, can affect performance

"LOG_AGENTS_SEPARATELY": True # iql will log independent agents separately
